services:
  # Build service - builds the extension
  builder:
    build:
      context: .
      dockerfile: Dockerfile
      target: extension-builder
      args:
        TARGETPLATFORM: linux/amd64
    volumes:
      - ./out:/build/out
      - ./dist:/build/dist
    command: npm run compile

  # Development service - for testing and development
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETPLATFORM: linux/amd64
    volumes:
      # Mount source code for development
      - ./src:/app/src:ro
      - ./cpp-tools:/app/cpp-tools:ro
      - ./out:/app/out
      - ./dist:/app/dist
      # Mount workspace for analysis
      - ./tests:/app/tests:ro
      # Mount config files needed for compilation and linting
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./.eslintrc.json:/app/.eslintrc.json:ro
      - ./jest.config.js:/app/jest.config.js:ro
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
    environment:
      - NODE_ENV=development
    working_dir: /app
    command: tail -f /dev/null  # Keep container running

  # Production service - runs the built extension
  production:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETPLATFORM: linux/amd64
    volumes:
      - ./dist:/app/dist
      - ./workspace:/app/workspace:ro  # Mount your C++ workspace here
    environment:
      - NODE_ENV=production
    working_dir: /app
    command: node --version





