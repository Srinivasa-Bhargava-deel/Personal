services:
  # Build service - builds the extension
  builder:
    build:
      context: .
      dockerfile: Dockerfile
      target: extension-builder
    volumes:
      - ./out:/build/out
      - ./dist:/build/dist
    command: npm run compile

  # Development service - for testing and development
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev  # Use dev stage with all build tools
    volumes:
      # Mount source code for development
      - ./src:/app/src:ro
      # DO NOT mount cpp-tools - use the built binary from Docker image to avoid architecture mismatch
      # The built cfg-exporter binary in the image is compiled for linux/amd64 and matches the container
      # Mounting local cpp-tools would override it with potentially wrong architecture binary
      # - ./cpp-tools:/app/cpp-tools:ro  # COMMENTED OUT to use built binary from image
      - ./out:/app/out
      - ./dist:/app/dist
      # Mount workspace for analysis
      - ./tests:/app/tests:ro
      # Mount config files needed for compilation and linting
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./.eslintrc.json:/app/.eslintrc.json:ro
      - ./jest.config.js:/app/jest.config.js:ro
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
    environment:
      - NODE_ENV=development
      # Ensure PATH includes LLVM, build tools, and node_modules/.bin for npm scripts
      - PATH=/app/node_modules/.bin:/usr/lib/llvm-17/bin:/usr/bin:/usr/local/bin:/app/cpp-tools/cfg-exporter/build:$PATH
      # Set LD_LIBRARY_PATH for cfg-exporter to find LLVM shared libraries
      - LD_LIBRARY_PATH=/usr/lib/llvm-17/lib
      - LLVM_DIR=/usr/lib/llvm-17/lib/cmake/llvm
      - Clang_DIR=/usr/lib/llvm-17/lib/cmake/clang
    working_dir: /app
    # Ensure out directory exists and has proper permissions before starting
    # Verify all development tools are accessible
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cd /app || exit 1
        echo "=== Setting up development environment ==="
        echo "[DRY RUN] Current working directory: $(pwd)"
        echo "[DRY RUN] Platform architecture: $(uname -m)"
        echo "[DRY RUN] OS: $(uname -s)"
        mkdir -p /app/out
        chmod -R 777 /app/out || true
        echo ""
        echo "=== Verifying development tools are accessible ==="
        echo "PATH: $PATH"
        echo ""
        if command -v clang-17 >/dev/null 2>&1; then
          echo "✓ clang-17: $(clang-17 --version | head -n1)"
        else
          echo "✗ ERROR: clang-17 not found in PATH"
        fi
        if command -v gcc >/dev/null 2>&1; then
          echo "✓ gcc: $(gcc --version | head -n1)"
        else
          echo "✗ ERROR: gcc not found in PATH"
        fi
        if command -v g++ >/dev/null 2>&1; then
          echo "✓ g++: $(g++ --version | head -n1)"
        else
          echo "✗ ERROR: g++ not found in PATH"
        fi
        if command -v python3 >/dev/null 2>&1; then
          echo "✓ python3: $(python3 --version)"
        else
          echo "✗ ERROR: python3 not found in PATH"
        fi
        if command -v cmake >/dev/null 2>&1; then
          echo "✓ cmake: $(cmake --version | head -n1)"
        else
          echo "✗ ERROR: cmake not found in PATH"
        fi
        if command -v cfg-exporter >/dev/null 2>&1; then
          echo "✓ cfg-exporter: available at $(which cfg-exporter)"
          if [ -x "$(which cfg-exporter)" ]; then
            echo "  Binary is executable"
            BINARY_INFO=$(file "$(which cfg-exporter)" || echo "unknown")
            echo "  $BINARY_INFO"
            if echo "$BINARY_INFO" | grep -qE "x86-64|amd64|ELF 64-bit.*Linux"; then
              echo "  ✓ Binary architecture verified: Linux x86_64/amd64"
            else
              echo "  ✗ ERROR: Binary architecture mismatch!"
            fi
          fi
        else
          echo "⚠ WARNING: cfg-exporter not found in PATH (may need full path)"
          if [ -f "/app/cpp-tools/cfg-exporter/build/cfg-exporter" ]; then
            echo "  Found at /app/cpp-tools/cfg-exporter/build/cfg-exporter"
            BINARY_INFO=$(file /app/cpp-tools/cfg-exporter/build/cfg-exporter || echo "unknown")
            echo "  $BINARY_INFO"
            if echo "$BINARY_INFO" | grep -qE "x86-64|amd64|ELF 64-bit.*Linux"; then
              echo "  ✓ Binary architecture verified: Linux x86_64/amd64"
              chmod +x /app/cpp-tools/cfg-exporter/build/cfg-exporter
              echo "  Made binary executable"
            else
              echo "  ✗ ERROR: Binary architecture mismatch! Expected Linux x86_64/amd64"
            fi
          fi
        fi
        echo ""
        echo "=== Verifying Node.js and npm setup ==="
        if command -v node >/dev/null 2>&1; then
          echo "✓ node: $(node --version)"
        else
          echo "✗ ERROR: node not found in PATH"
        fi
        if command -v npm >/dev/null 2>&1; then
          echo "✓ npm: $(npm --version)"
        else
          echo "✗ ERROR: npm not found in PATH"
        fi
        if [ -d "/app/node_modules" ]; then
          echo "✓ node_modules directory exists"
          if [ -f "/app/node_modules/.bin/tsc" ]; then
            echo "✓ TypeScript compiler (tsc) found in node_modules/.bin"
          else
            echo "⚠ WARNING: tsc not found in node_modules/.bin"
            echo "  Checking for TypeScript package..."
            if [ -d "/app/node_modules/typescript" ]; then
              echo "  ✓ typescript package found, but tsc binary missing"
            else
              echo "  ✗ ERROR: typescript package not found in node_modules"
            fi
          fi
        else
          echo "✗ ERROR: node_modules directory not found at /app/node_modules"
        fi
        if [ -f "/app/tsconfig.json" ]; then
          echo "✓ tsconfig.json found"
        else
          echo "✗ ERROR: tsconfig.json not found at /app/tsconfig.json"
        fi
        if [ -f "/app/package.json" ]; then
          echo "✓ package.json found"
        else
          echo "✗ ERROR: package.json not found at /app/package.json"
        fi
        if [ -d "/app/src" ]; then
          echo "✓ src directory found"
        else
          echo "✗ ERROR: src directory not found at /app/src"
        fi
        if [ -d "/app/out" ]; then
          echo "✓ out directory exists and is writable"
        else
          echo "⚠ WARNING: out directory not found (will be created on compile)"
        fi
        echo ""
        echo "=== Testing npm compile setup ==="
        echo "[DRY RUN] Verifying npm can find package.json:"
        if [ -f "/app/package.json" ]; then
          echo "  ✓ package.json found at /app/package.json"
          echo "[DRY RUN] Current directory: $(pwd)"
          echo "[DRY RUN] Testing npm from /app directory:"
          cd /app && npm --version >/dev/null 2>&1 && echo "  ✓ npm works from /app" || echo "  ✗ ERROR: npm failed from /app"
        else
          echo "  ✗ ERROR: package.json not found at /app/package.json"
        fi
        echo ""
        echo "=== Development environment ready ==="
        echo ""
        echo "To test npm compile, run:"
        echo "  docker-compose exec dev bash -c 'cd /app && npm run compile'"
        echo ""
        echo "If compile fails, check:"
        echo "  - node_modules/.bin/tsc exists: docker-compose exec dev ls -la /app/node_modules/.bin/tsc"
        echo "  - TypeScript version: docker-compose exec dev npx tsc --version"
        echo "  - Config files: docker-compose exec dev ls -la /app/*.json"
        echo ""
        tail -f /dev/null

  # Production service - runs the built extension
  production:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./dist:/app/dist
      - ./workspace:/app/workspace:ro  # Mount your C++ workspace here
    environment:
      - NODE_ENV=production
    working_dir: /app
    command: node --version





